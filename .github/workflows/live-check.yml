name: Live checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'   # daily 9:17 AM Manila
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Wait for Hostinger deploy
        if: github.event_name == 'push'
        run: sleep 90
      - run: node tests/live-check.mjs
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()") python tests/e2e.py
