<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pick a side. Hear the other. Vote on topics and chat anonymously with people who disagree.">
<meta name="theme-color" content="#F6F3EE">
<title>Speak Onion</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:title" content="Speak Onion">
<meta property="og:description" content="Pick a side. Hear the other. Vote on topics and chat anonymously with people who disagree.">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--line:#E2DDD5;--soft:#EFEBE4;--text:#1A1523;--muted:#6B6577;--a:#5B21B6;--aText:#FFFFFF;--b:#D9F99D;--bText:#1A2E05;--ink:#1A1523;--inkText:#FFFFFF;--tagA:#EDE9FE;--tagAText:#5B21B6;--tagB:#ECFCCB;--tagBText:#3F6212;--err:#B91C1C;--shadow:0 1px 2px rgba(26,21,35,.06),0 8px 24px rgba(26,21,35,.06);--display:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
body.theme-dark{--bg:#121016;--card:#1F1B26;--line:#34303D;--soft:#28232F;--text:#F4F1EA;--muted:#A39DAE;--a:#7C3AED;--ink:#D9F99D;--inkText:#1A2E05;--tagA:#3B2470;--tagAText:#DDD6FE;--tagB:#2A3A12;--tagBText:#D9F99D;--err:#FCA5A5;--shadow:none}
body.purge-chat{--bg:#000;--card:#0B0B0B;--line:#262626;--soft:#161616;--text:#F2F2F2;--muted:#A8A8A8;--ink:#D9F99D;--inkText:#1A2E05;--err:#FCA5A5;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;transition:background .2s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;min-height:44px;font:800 22px var(--display);letter-spacing:-.03em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;color:inherit}
.switch{width:56px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.switch .track{position:relative;display:block;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background .2s}
.switch .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:left .2s,background .2s}
.switch[aria-checked="true"] .track{background:#D9F99D}
.switch[aria-checked="true"] .knob{left:22px;background:#1A2E05}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.pill.ink{background:var(--ink);border-color:var(--ink);color:var(--inkText)}
.pill.sideA{background:var(--a);border-color:var(--a);color:var(--aText)}
.pill.sideB{background:var(--b);border-color:var(--b);color:var(--bText)}
.pill:disabled{opacity:.55;cursor:default}
.wide{width:100%;min-height:48px;border-radius:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.purge{margin:0 16px 8px;border-radius:14px;background:#1A1523;color:#fff;padding:10px 14px;font-size:13px}
body.theme-dark .purge,body.purge-chat .purge{background:#2A0F3D}
main{display:flex;flex-direction:column;gap:12px;padding:4px 14px 48px;max-width:1240px;margin:0 auto;width:100%}
.hero{font:800 34px/1.05 var(--display);letter-spacing:-.035em;padding:4px 6px 4px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--inkText)}
.feed{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch}
.feed > .card{display:flex;flex-direction:column}
.feed .topic{flex:1}
.feed .meta{margin-top:auto}
.pill.ghost{background:var(--soft);border-color:var(--soft);color:var(--muted)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:1px solid transparent}
body.theme-dark .card{border-color:var(--line)}
.topic{display:flex;flex-direction:column;gap:14px;width:100%;padding:18px 18px 4px;border:0;background:none;text-align:left;border-radius:24px}
.topic .title,h1{margin:0;font:700 21px/1.2 var(--display);letter-spacing:-.02em}
h1{font-size:26px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tag{font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.a{background:var(--tagA);color:var(--tagAText)}
.tag.b{background:var(--tagB);color:var(--tagBText)}
.blocks{display:flex;gap:6px;height:46px}
.blocks span{min-width:56px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden}
.blocks .ba{background:var(--a);color:var(--aText)}
.blocks .bb{background:var(--b);color:var(--bText)}
.meta{display:flex;gap:16px;font-size:12px;font-weight:500;color:var(--muted);padding-bottom:14px}
.cardfoot{padding:0 18px 18px}
.pad{padding:18px;display:flex;flex-direction:column;gap:14px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft)}
textarea{resize:vertical}
.err{color:var(--err);font-size:12px;min-height:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:8px;padding:14px 18px 6px}
.tab{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text);font-weight:600;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--inkText)}
.comment{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.comment .acts{display:flex;gap:12px}
.link{border:0;background:none;padding:0;min-height:32px;color:var(--muted);font-weight:600;font-size:12px}
.notice{border-radius:14px;padding:12px 14px;background:var(--soft);font-size:13px}
.center{padding:72px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.center b.big{font:700 22px var(--display)}
.spinner{width:52px;height:52px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--a);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topicLayout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.chat{display:flex;flex-direction:column;gap:12px;padding:0 14px 16px;min-height:calc(100vh - 70px);max-width:720px;width:100%;margin:0 auto}
.chat .head{display:flex;align-items:center;gap:10px}
.chat .ctx{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.chat .msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 2px;overflow-y:auto;min-height:280px}
.bubble{max-width:78%;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.me{align-self:flex-end;background:var(--a);color:#fff;border-radius:20px 20px 6px 20px}
.them{align-self:flex-start;background:var(--card);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow)}
.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.compose{display:flex;gap:8px}
.compose input{border-radius:999px;min-height:52px;background:var(--card);border:1px solid var(--line)}
.send{width:52px;height:52px;border-radius:50%;border:0;background:#D9F99D;color:#1A2E05;display:flex;align-items:center;justify-content:center;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{padding:16px;text-align:center}
@media (min-width:760px){
  header{padding:18px 24px}
  main{padding:4px 24px 64px}
  .hero{font-size:52px;padding:8px 4px 8px}
  .feed{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .purge{margin:0 24px 8px}
}
@media (min-width:1000px){
  .feed{grid-template-columns:repeat(3,minmax(0,1fr))}
  .topicLayout{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
  .topicLayout > .card:first-child{position:sticky;top:90px}
}

/* ---- Gemini redesign ---- */
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px}
.app{max-width:none}
.app > header{position:sticky;top:0}
.wrap{max-width:1240px;margin:0 auto;width:100%}
.brand{font-size:21px}
.beta{font:700 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:#D9F99D;color:#1A2E05;padding:3px 8px;border-radius:999px;margin-left:2px}
.headright{display:flex;align-items:center;gap:10px}
.roundbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.roundbtn svg{width:16px;height:16px}
.whopill{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 14px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#A3E635);color:#fff;font:700 11px Inter,sans-serif;display:flex;align-items:center;justify-content:center}
.textbtn{border:0;background:none;color:var(--muted);font-weight:500;min-height:38px;padding:0 6px}
.dotpill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.livepill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;color:var(--muted)}
.livepill b{color:var(--text)} .livepill .ch{color:var(--a);font-weight:600}
.livedot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.hero{font-size:46px;margin-top:18px}
.hero .ul{background:linear-gradient(transparent 82%,#A3E635 82%,#A3E635 94%,transparent 94%)}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lede{color:var(--muted);max-width:560px;margin:4px 0 0;padding:0 4px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:20px}
.toolbar .seg{display:flex;gap:2px;align-items:center}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.toolbar .grow{flex:1}
.sortbtn{min-height:36px;padding:0 14px;border-radius:10px;border:0;background:none;color:var(--text);font-size:14px;display:flex;align-items:center;gap:6px}
.sortbtn[aria-selected="true"]{background:var(--ink);color:var(--inkText);font-weight:600}
.chanbtn{min-height:32px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:13px}
.chanbtn[aria-selected="true"]{background:var(--tagA);color:var(--tagAText);font-weight:600}
.search{position:relative;min-width:200px;flex:0 1 230px}
.search input{width:100%;min-height:36px;border-radius:10px;padding:0 12px 0 32px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.feed{margin-top:18px;gap:18px}
.feed > .card{border:1px solid var(--line);padding:22px 22px 20px;gap:12px;box-shadow:0 1px 2px rgba(26,21,35,.04)}
.feed .ctop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.feed .ctop b{color:var(--text);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.badge.picked{background:#ECFCCB;color:#3F6212}
.badge.open{background:var(--soft);color:var(--text)}
.badge.open::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a)}
.ctitle{margin:0;font:700 20px/1.25 var(--display);letter-spacing:-.02em;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;min-height:50px}
.thin{display:flex;gap:3px;height:5px}
.thin span{border-radius:999px;display:block}
.hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:46px;padding:0 12px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:15px}
.opt small{font-weight:500;font-size:11px;opacity:.85}
.opt.a{background:#7C3AED;color:#fff}
.opt.b{background:#D9F99D;color:#1A2E05}
.opt.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4.5px var(--text)}
.opt.dim{opacity:.45}
.opt .right{display:flex;align-items:center;gap:6px}
.opt .yp{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.25)}
.opt.b .yp{background:rgba(26,46,5,.12)}
div.opt{cursor:default}
.badge.picked.pa{background:#EDE9FE;color:#5B21B6}
.badge.picked.pb{background:#ECFCCB;color:#3F6212}
.votebox{display:flex;flex-direction:column;gap:10px}
@keyframes resort{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.feed.resorted > .card{animation:resort .28s ease}
.opt .pct{font:700 10px ui-monospace,monospace;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.18)}
.opt.b .pct{background:rgba(26,46,5,.12)}
.cmeta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.cmeta span{display:inline-flex;align-items:center;gap:5px}
.cmeta .r{margin-left:auto;font-size:11px}
.enter{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--inkText);font-weight:700;font-size:15px}
.enter .l{display:flex;align-items:center;gap:8px}
.enter .l::before{content:"";width:8px;height:8px;border-radius:50%;background:#A78BFA}
.enter .r{font-size:13px;font-weight:600;opacity:.85}
.locked{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;border:1.5px dashed var(--line);background:var(--soft);color:var(--muted);font-weight:600}
.sitefoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:40px;padding:24px 4px;font-size:13px;color:var(--muted);text-align:left}
.sitefoot b{color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:#7C3AED}
.toggle input:checked::after{left:16px}
.textbtn svg{display:none}
.brand,.textbtn,.sortbtn,.chanbtn,.whopill{white-space:nowrap}
html,body{overflow-x:hidden}
@media (max-width:760px){
  .hero{font-size:36px}
  header{padding:8px 10px}
  .brand{font-size:18px;gap:8px}
  .brand svg{width:30px;height:30px}
  .headright{gap:6px}
  .whopill{padding:0 5px;min-height:36px}
  .whopill .as,.whopill b{display:none}
  .roundbtn{width:36px;height:36px}
  .dotpill{min-height:36px;padding:0 12px}
  .textbtn{padding:0 4px;display:flex;align-items:center}
  .textbtn .lbl{display:none}
  .textbtn svg{display:block}
  .beta{display:none}
  .toolbar{padding:8px}
  .toolbar .sep,.toolbar .grow{display:none}
  .toolbar .seg{width:100%;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .toolbar .seg::-webkit-scrollbar{display:none}
  .search{flex:1 1 100%}
}
@media (max-width:400px){ .beta{display:none} }

/* ---- Typography: Plus Jakarta Sans for display, Inter for UI ---- */
html,body{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
.brand,.hero,h1,.ctitle,.topic .title,.center b.big{font-family:var(--display);letter-spacing:-0.03em}
.brand{font-weight:800}
.hero{font-weight:800}
h1,.ctitle,.topic .title{font-weight:700}
.opt,.pct,.cmeta,.livepill,.sortbtn,.chanbtn,.badge,.enter,.locked,.pill,.blocks{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.opt .pct{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:11px}
</style>

<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="iconbtn" id="back" aria-label="Back" hidden><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="brand" id="home" aria-label="Speak Onion home">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 30 30"><rect width="30" height="30" rx="9" fill="#6D28D9"/><path d="M15 7c-4.5 3.2-6.5 6.2-6.5 9.3a6.5 6.5 0 0 0 13 0c0-3.1-2-6.1-6.5-9.3z" fill="none" stroke="#fff" stroke-width="2"/><path d="M15 10.5c-1.6 1.9-2.4 3.8-2.4 5.8s.8 3.4 2.4 4.6c1.6-1.2 2.4-2.6 2.4-4.6s-.8-3.9-2.4-5.8z" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
        <span>Speak Onion</span><span class="beta">Beta</span>
      </button>
    </div>
    <div class="headright">
      <div id="headRight" class="headright"></div>
      <button class="roundbtn" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"><span id="knob"></span></button>
      <div id="headRight2" class="headright"></div>
    </div>
  </header>
  <div id="purgeBar" class="purge" hidden><b>Purge Hour</b> · Chats are unfiltered until :59. Slurs, threats and personal info are still blocked. Comments keep normal rules.</div>
  <div id="view"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(() => {
  const CFG = window.SPEAK_ONION_CONFIG || {};
  const configured = CFG.SUPABASE_URL && !/YOUR-PROJECT/.test(CFG.SUPABASE_URL);
  const sb = configured ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

  // ---------- state ----------
  const S = {
    screen: 'home', topicId: null, sort: 'hot', tab: 'a',
    topics: [], pv: [], mine: {}, reported: {},
    loaded: false, error: '', busy: false,
    user: null, isAdmin: false,
    pick: null, draft: '', chat: null, simPurge: false, matchNote: ''
  };
  const $ = (id) => document.getElementById(id);
  const view = $('view');

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));

          h('div', { class: 'small muted', text: x.masked + (x.email ? ' (' + x.email + ')' : '') + ' on "' + x.topic_title + '" · ' + x.reports + ' report' + (x.reports == 1 ? '' : 's') + (x.hidden ? ' · HIDDEN' : '') }),
          h('div', { text: x.comment })),
        h('button', { class: 'pill', onclick: () => adminAct(() => sb.from('votes').update({ hidden: !x.hidden }).eq('id', x.vote_id)), text: x.hidden ? 'Unhide' : 'Hide' })));
    }
    return main;
  }

  // ---------- theme ----------
  const SUN = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D9F99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(dark) { document.body.classList.toggle('theme-dark', dark); $('theme').setAttribute('aria-checked', String(dark)); $('knob').innerHTML = dark ? MOON : SUN; }
  let saved = null; try { saved = localStorage.getItem('so-theme'); } catch (e) { }
  applyTheme(saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  $('theme').addEventListener('click', () => { const d = !document.body.classList.contains('theme-dark'); applyTheme(d); try { localStorage.setItem('so-theme', d ? 'dark' : 'light'); } catch (e) { } });

  // ---------- wiring ----------
  $('home').addEventListener('click', () => go('home'));
  $('back').addEventListener('click', () => (S.screen === 'notFound') ? go('home') : go(S.screen === 'newTopic' && S.isAdmin ? 'admin' : ['topic', 'newTopic', 'signin', 'admin'].includes(S.screen) ? 'home' : 'topic'));
  syncServerClock(); setInterval(syncServerClock, 300000);
  setInterval(() => { const on = purgeOn(); if (on !== S._purge) { S._purge = on; if (S.screen !== 'chat') render(); else { document.body.classList.toggle('purge-chat', on); $('purgeBar').hidden = !on; } } }, 30000);
  render();
  if (sb) {
    sb.auth.onAuthStateChange((_e, session) => {
      const was = S.user && S.user.id; S.user = session ? session.user : null;
      if ((S.user && S.user.id) !== was) { if (S.screen === 'signin' && S.user) S.screen = 'home'; loadAll(); if (was !== undefined) restartLive(); }
    });
    sb.auth.getSession().then(({ data }) => { S.user = data.session ? data.session.user : null; loadAll(); startLive(); });
    setInterval(() => { if (document.visibilityState === 'visible') loadAll(); }, 20000);
  }
})();
</script>
</body>
</html>
